services:
  api_c:
    build: { context: .., dockerfile: c/api/Dockerfile }
    ports: ["8003:8000"]
    volumes: ["./models:/app/models:ro"]
    env_file: ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
  front_c:
    build: ./frontend
    ports: ["3003:80"]
    depends_on:
      api_c: { condition: service_healthy }
