stages:
  prepare:
    cmd: python src/preprocessing.py
    deps: [data/raw, ../contract/splits, src/preprocessing.py]
    outs: [data/processed]
  train:
    cmd: python src/train.py
    deps: [data/processed, src/train.py]
    params: [train]
    outs: [models/checkpoint]
  evaluate:
    cmd: python src/evaluate.py
    deps: [models/checkpoint, data/processed]
    metrics: [metrics.json]
  export:
    cmd: python src/export_onnx.py
    deps: [models/checkpoint]
    outs: [models/model.onnx, models/model_card.json]
