services:
  api_b:
    build: { context: .., dockerfile: b/api/Dockerfile }
    ports: ["8002:8000"]
    volumes: ["./models:/app/models:ro"]
    env_file: ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
  front_b:
    build: ./frontend
    ports: ["3002:80"]
    depends_on:
      api_b: { condition: service_healthy }
