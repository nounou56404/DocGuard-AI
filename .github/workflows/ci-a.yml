name: ci-a
on:
  push:
    paths: ["a/**", "contract/**"]
  pull_request:
    paths: ["a/**", "contract/**"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff black mypy
      - run: ruff check a/ && black --check a/
  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r a/api/requirements.txt pytest
      - run: pytest a/tests
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api_a -f a/api/Dockerfile .
      - run: docker build -t front_a ./a/frontend
