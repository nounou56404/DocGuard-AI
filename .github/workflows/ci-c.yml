name: ci-c
on:
  push:
    paths: ["c/**", "contract/**"]
  pull_request:
    paths: ["c/**", "contract/**"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff black mypy
      - run: ruff check c/ && black --check c/
  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r c/api/requirements.txt pytest
      - run: pytest c/tests
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api_c -f c/api/Dockerfile .
      - run: docker build -t front_c ./c/frontend
