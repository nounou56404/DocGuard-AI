name: ci-b
on:
  push:
    paths: ["b/**", "contract/**"]
  pull_request:
    paths: ["b/**", "contract/**"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff black mypy
      - run: ruff check b/ && black --check b/
  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r b/api/requirements.txt pytest
      - run: pytest b/tests
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api_b -f b/api/Dockerfile .
      - run: docker build -t front_b ./b/frontend
