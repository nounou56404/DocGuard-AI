name: ci-X
on:
  push:
    paths: ["X/**", "contract/**"]
  pull_request:
    paths: ["X/**", "contract/**"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff black mypy
      - run: ruff check X/ && black --check X/
  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r X/api/requirements.txt pytest
      - run: pytest X/tests
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api_X -f X/api/Dockerfile .
      - run: docker build -t front_X ./X/frontend
