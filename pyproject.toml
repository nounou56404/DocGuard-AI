[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docguard-ai"
version = "0.1.0"
description = "Detection de documents scam / non_scam (vision, OCR, MLOps)"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "PyYAML", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
