stages:
  validate:
    cmd: python -m docguard_ai.pipeline.run_stage validate
    deps:
      - data/metadata/image_manifest.csv
      - src/docguard_ai/data
    outs:
      - data/interim/quality.json

  prepare:
    cmd: python -m docguard_ai.pipeline.run_stage prepare
    deps:
      - data/metadata/image_manifest.csv
      - data/interim/quality.json
      - src/docguard_ai/data
      - src/docguard_ai/vision/preprocessing.py
    params:
      - seed
      - prepare
      - preprocess
    outs:
      - data/processed/manifest.csv
      - data/processed/images

  baselines:
    cmd: python -m docguard_ai.pipeline.run_stage baselines
    deps:
      - data/processed/manifest.csv
      - src/docguard_ai/models/baselines.py
    metrics:
      - reports/baselines.json:
          cache: false

  train:
    foreach: [cnn, vit, ocr]
    do:
      cmd: python -m docguard_ai.pipeline.run_stage train --approach ${item}
      deps:
        - data/processed/manifest.csv
        - data/processed/images
        - src/docguard_ai/models
      params:
        - seed
        - preprocess
        - train.${item}
      outs:
        - models/${item}/checkpoint
        - models/${item}/predictions_test.csv

  evaluate:
    foreach: [cnn, vit, ocr]
    do:
      cmd: python -m docguard_ai.pipeline.run_stage evaluate --approach ${item}
      deps:
        - models/${item}/predictions_test.csv
        - src/docguard_ai/models/evaluate.py
      params:
        - evaluate
      metrics:
        - reports/${item}/metrics.json:
            cache: false

  export:
    foreach: [cnn, vit, ocr]
    do:
      cmd: python -m docguard_ai.pipeline.run_stage export --approach ${item}
      deps:
        - models/${item}/checkpoint
        - src/docguard_ai/models/export_onnx.py
      params:
        - export
      outs:
        - models/${item}/model.onnx
        - models/${item}/model_card.json
