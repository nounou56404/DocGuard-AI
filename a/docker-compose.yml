services:
  api_a:
    build: { context: .., dockerfile: a/api/Dockerfile }
    ports: ["8001:8000"]
    volumes: ["./models:/app/models:ro"]
    env_file: ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
  front_a:
    build: ./frontend
    ports: ["3001:80"]
    depends_on:
      api_a: { condition: service_healthy }
